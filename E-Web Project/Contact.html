<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Us</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body class="body">

        <div class="header">
            <div class="navbar">
                <div class="logo">
                    <a href="Home.html" class="back_home"><img src="images/nike-3d-logo.jpg" alt="NIKE Logo" class="logo_style"></a>
                </div>

                <nav>
                    <ul>
                        <li><a href="Home.html" class="ca">Home</a></li>
                        <li><a href="Products.html" class="ca">Products</a></li>
                        <li><a href="About.html" class="ca">About</a></li>
                        <li><a href="Contact.html" class="ca">Contact</a></li>
                        
                        <img src="images/heart.png" width="30px" height="30px" alt="Like">
                        <img src="images/shopping-cart.png" width="30px" height="30px" alt="Cart">
                    </ul>
                </nav>

                <div class="search">
                    <input type="text" placeholder="Search Products" class="search-box">
                    <button type="submit" class="btn_search">Search</button>
                </div>
            </div>
        </div>

        <div class="contact-section">
            <h1>Contact Us</h1>
            <p>Have questions or feedback? We'd love to hear from you!</p>

            <form action="#" method="post">
                <label for "name">Name:</label>
                <input type "text" id "name" name "name" required>

                <label for "email">Email:</label>
                <input type "email" id "email" name "email" required>

                <label for "message">Message:</label>
                <textarea id "message" name "message" rows "5" required></textarea>

                <button type "submit">Send Message</button>
            </form>
        </div>
    </body>
</html>
